[project]
name = "rotse-weather-mast"
version = "0.1.0"
description = "ROTSE-IIIc weather mast Pi: SHT45 + BME280 over I2C, latest readings as JSON for pyobs-weather"
readme = "README.md"
authors = [
    { name = "Enzo Peres Afonso", email = "enzo.p.afonso@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.4",
    "smbus2>=0.5",
    "RPi.bme280>=0.2.4",
]

[project.scripts]
rotse-weather-mast = "rotse_weather_mast.main:main"

[dependency-groups]
dev = [
    "black>=24.0",
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # RPi.bme280 0.2.4 stamps readings with datetime.utcnow(); we don't use that timestamp.
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
